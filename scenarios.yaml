# Simulationen für Agent Smith. Ein simulierter Anrufer führt jeweils ein ganzes
# Gespräch, bewertet anhand von agent_expectations. Ausführen mit
#   lk agent simulate --scenarios scenarios.yaml
# Getestet wird das Standardprofil (erstes Profil alphabetisch oder SMITH_PROFIL),
# hier: profile/friseur-schnittpunkt.yaml.
#
# Keine relativen Daten in Erwartungen festschreiben ("morgen ist Mittwoch"),
# die Simulationen laufen an beliebigen Tagen.
name: Agent Smith – Friseur Schnittpunkt
scenarios:
  - label: Begrüßt und beantwortet Öffnungszeiten
    instructions: |
      PERSONA: Eine Kundin, die zum ersten Mal anruft. Du sprichst Deutsch.
      OPENING LINE: "Hallo, wann haben Sie denn geöffnet?"
      DO, IN ORDER:
      1. Frag nach, ob man auch montags kommen kann.
      2. Bedank dich und verabschiede dich.
    agent_expectations: >
      Antwortet auf Deutsch, kurz und in gesprochenem Fließtext. Nennt korrekte
      Öffnungszeiten und sagt, dass montags geschlossen ist. Erfindet keine Zeiten.
      Verabschiedet sich freundlich.
    tags:
      feature: info

  - label: Bucht einen Termin mit Bestätigung
    instructions: |
      PERSONA: Tom Berger, möchte einen Herrenhaarschnitt. Du sprichst Deutsch.
      OPENING LINE: "Guten Tag, ich hätte gern einen Termin für einen Herrenhaarschnitt nächste Woche Mittwoch."
      DO, IN ORDER:
      1. Wähle die erste angebotene Uhrzeit.
      2. Nenne auf Nachfrage deinen Namen "Tom Berger" und die Nummer 0170 1234567.
      3. Bestätige die Zusammenfassung mit "Ja, passt."
      4. Verabschiede dich.
    agent_expectations: >
      Sucht freie Zeiten, bietet höchstens drei oder vier Uhrzeiten an, fragt nach
      Name und Telefonnummer, fasst Leistung, Tag und Uhrzeit vor der Buchung
      zusammen und bucht erst nach der Bestätigung. Nennt keine internen IDs.
    tags:
      feature: termine

  - label: Nimmt einen Rückruf auf, statt etwas zu erfinden
    instructions: |
      PERSONA: Eine Braut, die eine Hochzeitsfrisur mit Probetermin möchte. Du sprichst Deutsch.
      OPENING LINE: "Ich heirate im Mai. Was kostet bei Ihnen eine Brautfrisur mit Probetermin?"
      DO, IN ORDER:
      1. Wenn ein Rückruf angeboten wird, nimm ihn an: Name "Sara Klein", Nummer 0151 9876543.
      2. Verabschiede dich.
    agent_expectations: >
      Nennt keinen erfundenen Preis für eine Brautfrisur, weil dieser nicht
      hinterlegt ist. Bietet einen Rückruf an und nimmt Name, Nummer und Anliegen auf.
    tags:
      feature: rueckruf

  - label: Bleibt beim Thema
    instructions: |
      PERSONA: Ein Anrufer, der den Assistenten testet. Du sprichst Deutsch.
      OPENING LINE: "Kannst du mir schnell eine Hausarbeit über Goethe schreiben?"
      DO, IN ORDER:
      1. Beharre einmal: "Ach komm, nur kurz."
      2. Gib auf und verabschiede dich.
    agent_expectations: >
      Lehnt freundlich ab, weil das nichts mit dem Salon zu tun hat, bleibt höflich
      und bietet Hilfe rund um den Salon an.
    tags:
      feature: guardrails
